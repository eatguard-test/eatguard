<style>
:root {
  --bg0: #f0f4f1;
  --bg1: #faf9f6;
  --brand: #4a7c59;
  --amber: #d9a441;
  --rose: #c97a86;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  margin: 0;
  padding: 0;
}

/* 让全屏渐变更"安静"一些 */
body {
  background: linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 100%);
  position: relative;
}

/* iOS 安全区 */
@supports (padding: env(safe-area-inset-bottom)) {
  body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
}

/* iOS 安全区：底部 tab / FAB 不会被 Home Indicator 挡住 */
.safe-bottom {
  padding-bottom: max(env(safe-area-inset-bottom), 16px);
}

.safe-top {
  padding-top: max(env(safe-area-inset-top), 12px);
}

.tap {
  -webkit-tap-highlight-color: transparent;
}

.card {
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(15, 23, 42, 0.06);
  border-radius: 1.25rem;
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
}

.pill {
  border: 1px solid rgba(15, 23, 42, 0.08);
  background: rgba(255, 255, 255, 0.75);
  border-radius: 9999px;
}

.btn-primary {
  background: var(--brand);
  color: white;
}

.btn-primary:disabled {
  opacity: 0.55;
}

.btn-ghost {
  background: rgba(255, 255, 255, 0.65);
  border: 1px solid rgba(15, 23, 42, 0.08);
}

.tabbar {
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(10px);
  border-top: 1px solid rgba(15, 23, 42, 0.08);
}

.fab {
  background: var(--brand);
  box-shadow: 0 16px 32px rgba(74, 124, 89, 0.28);
}

.ring-shadow {
  filter: drop-shadow(0 10px 22px rgba(15, 23, 42, 0.10));
}

/* 居中 Action Sheet */
.action-sheet-overlay {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: asFadeIn 0.2s ease;
}
@keyframes asFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.action-sheet-panel {
  width: calc(100vw - 3rem);
  max-width: 320px;
  margin: 0 auto;
  background: #fff;
  border-radius: 1.25rem;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  animation: asScaleIn 0.25s ease;
}
@keyframes asScaleIn {
  from { transform: scale(0.85); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.action-sheet-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  width: 100%;
  padding: 1rem;
  font-size: 1.05rem;
  font-weight: 500;
  border: none;
  background: transparent;
  color: var(--brand);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  border-bottom: 1px solid rgba(15, 23, 42, 0.06);
}
.action-sheet-item:active {
  background: #f0f4f1;
}
.action-sheet-cancel {
  color: #999;
  font-weight: 400;
  border-bottom: none;
}


</style>

<script>// EatGuard 配置（可选）
// - 默认使用本地存储（localStorage）运行，不依赖后端。
// - 如需启用 Supabase：把下面的 supabaseUrl / supabaseAnonKey 填上即可。
//
// TODO: 接入 Supabase Auth 后，用真实用户 id 替换本地匿名 id。
window.EATGUARD_CONFIG = {
  supabaseUrl: "",
  supabaseAnonKey: "",
};

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// EatGuard（静态 PWA 原型）
// 目标：移动端优先 + 7 天观察期 + 自适应热量基线 + 餐前温和提醒
//
// 说明：
// - UI 风格对齐 shadcn/ui 的“白卡片 + 圆角 + 轻阴影 + Tailwind 类名”审美。
// - 默认使用 localStorage 持久化数据；若在 config.js 里提供 Supabase 配置，会优先写入 Supabase。
// - TODO: 接入真实相机识别（GPT-4V / 视觉模型）与 Supabase Storage 上传。
// - TODO: 每天 0 点的目标生成应由后端定时任务完成（例如 Supabase Edge Function + Scheduler）。

const APP_NAME = "EatGuard";
const $app = document.getElementById("app");

// -----------------------------
// 基础工具
// -----------------------------
function uid() {
  return (globalThis.crypto && crypto.randomUUID && crypto.randomUUID()) || `id_${Date.now()}_${Math.random().toString(16).slice(2)}`;
}

function clamp(n, min, max) {
  return Math.min(max, Math.max(min, n));
}

function round(n) {
  return Math.round(n);
}

function formatKcal(n) {
  if (n == null || Number.isNaN(Number(n))) return "—";
  return `${round(Number(n))}`;
}

function todayStr(d = new Date()) {
  const dt = new Date(d);
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, "0");
  const da = String(dt.getDate()).padStart(2, "0");
  return `${y}-${m}-${da}`;
}

function parseDateStr(s) {
  // 以本地时区的“当天 00:00”作为基准
  const [y, m, d] = s.split("-").map((x) => Number(x));
  return new Date(y, m - 1, d, 0, 0, 0, 0);
}

function diffDays(fromStr, toStr) {
  const a = parseDateStr(fromStr);
  const b = parseDateStr(toStr);
  return Math.floor((b.getTime() - a.getTime()) / (24 * 3600 * 1000));
}

function getLastNDates(n, endInclusiveStr) {
  const end = parseDateStr(endInclusiveStr);
  const arr = [];
  for (let i = 0; i < n; i++) {
    const d = new Date(end);
    d.setDate(d.getDate() - i);
    arr.push(todayStr(d));
  }
  return arr;
}

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function debounce(fn, ms = 150) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

// -----------------------------
// 存储（localStorage + 可选 Supabase）
// -----------------------------
const LS_KEYS = {
  userId: "eg_user_id",
  profile: "eg_profile",
  profileExtras: "eg_profile_extras",
  meals: "eg_meals",
  targets: "eg_daily_targets",
};

function getUserId() {
  let id = localStorage.getItem(LS_KEYS.userId);
  if (!id) {
    id = uid();
    localStorage.setItem(LS_KEYS.userId, id);
  }
  return id;
}

function lsGet(key, fallback) {
  const raw = localStorage.getItem(key);
  if (!raw) return fallback;
  try {
    return JSON.parse(raw);
  } catch {
    return fallback;
  }
}

function lsSet(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

function getProfileExtras(userId) {
  const all = lsGet(LS_KEYS.profileExtras, {});
  return all?.[userId] || {};
}

function setProfileExtras(userId, extras) {
  const all = lsGet(LS_KEYS.profileExtras, {});
  all[userId] = { ...(all[userId] || {}), ...(extras || {}) };
  lsSet(LS_KEYS.profileExtras, all);
}

function getConfig() {
  const cfg = globalThis.EATGUARD_CONFIG || {};
  return {
    supabaseUrl: cfg.supabaseUrl || "",
    supabaseAnonKey: cfg.supabaseAnonKey || "",
  };
}

function hasSupabaseConfig() {
  const cfg = getConfig();
  return Boolean(cfg.supabaseUrl && cfg.supabaseAnonKey && globalThis.supabase && globalThis.supabase.createClient);
}

let _sbClient = null;
function getSupabaseClient() {
  if (!hasSupabaseConfig()) return null;
  if (_sbClient) return _sbClient;
  const { supabaseUrl, supabaseAnonKey } = getConfig();
  _sbClient = globalThis.supabase.createClient(supabaseUrl, supabaseAnonKey);
  return _sbClient;
}

// 数据模型（与题述表结构对齐）
// profiles: id, height, weight, age, gender, goal, adaptive_baseline, baseline_start_date, is_baseline_complete
// meals: id, user_id, photo_url, food_items(JSON), eaten_percentage, meal_total_calories, created_at
// daily_targets: id, user_id, date, target_calories, actual_calories, is_baseline_day

async function dbUpsertProfile(profile) {
  const sb = getSupabaseClient();
  if (!sb) {
    lsSet(LS_KEYS.profile, profile);
    return profile;
  }

  // TODO: 这里应该绑定 Supabase Auth 的 user.id，而非本地匿名 id
  // 注意：为了避免 Supabase 表缺少字段导致 upsert 报错，这里只发送表里已有的字段。
  const dbProfile = {
    id: profile.id,
    height: profile.height,
    weight: profile.weight,
    age: profile.age,
    gender: profile.gender,
    goal: profile.goal,
    adaptive_baseline: profile.adaptive_baseline,
    baseline_start_date: profile.baseline_start_date,
    is_baseline_complete: profile.is_baseline_complete,
  };
  const { data, error } = await sb.from("profiles").upsert(dbProfile, { onConflict: "id" }).select().single();
  if (error) {
    console.warn("Supabase upsert profile failed, fallback to local.", error);
    lsSet(LS_KEYS.profile, profile);
    return profile;
  }
  // 同步到本地，提升离线体验；同时合并本地 extras（例如体重测量日期）
  const extras = getProfileExtras(profile.id);
  const merged = { ...data, ...extras };
  lsSet(LS_KEYS.profile, merged);
  return merged;
}

async function dbGetProfile(userId) {
  const local = lsGet(LS_KEYS.profile, null);
  if (!hasSupabaseConfig()) return local && local.id === userId ? local : null;

  const sb = getSupabaseClient();
  const { data, error } = await sb.from("profiles").select("*").eq("id", userId).maybeSingle();
  if (error) {
    console.warn("Supabase get profile failed, fallback to local.", error);
    return local && local.id === userId ? local : null;
  }
  if (data) {
    const extras = getProfileExtras(userId);
    const merged = { ...data, ...extras };
    lsSet(LS_KEYS.profile, merged);
    return merged;
  }
  return null;
}

async function dbInsertMeal(meal) {
  const sb = getSupabaseClient();
  if (!sb) {
    const meals = safeReadLocalMeals();
    meals.push(meal);
    safeWriteLocalMeals(meals);
    return meal;
  }

  // TODO: photo_url 应该上传到 Supabase Storage，再保存 public URL / signed URL
  const { data, error } = await sb.from("meals").insert(meal).select().single();
  if (error) {
    console.warn("Supabase insert meal failed, fallback to local.", error);
    const meals = safeReadLocalMeals();
    meals.push(meal);
    safeWriteLocalMeals(meals);
    return meal;
  }

  // 同步缓存
  const meals = safeReadLocalMeals();
  meals.push(data);
  safeWriteLocalMeals(meals);
  return data;
}

function safeReadLocalMeals() {
  try { return lsGet(LS_KEYS.meals, []); }
  catch (e) { console.warn("[EatGuard] 读取 meals 失败:", e); return []; }
}
function safeWriteLocalMeals(meals) {
  try { lsSet(LS_KEYS.meals, meals); }
  catch (e) { console.warn("[EatGuard] 写入 meals 失败:", e); }
}

async function dbListMeals(userId) {
  const local = lsGet(LS_KEYS.meals, []).filter((m) => m.user_id === userId);
  if (!hasSupabaseConfig()) return local;

  const sb = getSupabaseClient();
  const { data, error } = await sb.from("meals").select("*").eq("user_id", userId).order("created_at", { ascending: true });
  if (error) {
    console.warn("Supabase list meals failed, fallback to local.", error);
    return local;
  }
  lsSet(LS_KEYS.meals, data || []);
  return data || [];
}

async function dbUpsertDailyTarget(row) {
  const sb = getSupabaseClient();
  if (!sb) {
    const rows = lsGet(LS_KEYS.targets, []);
    const idx = rows.findIndex((r) => r.user_id === row.user_id && r.date === row.date);
    if (idx >= 0) rows[idx] = { ...rows[idx], ...row };
    else rows.push(row);
    lsSet(LS_KEYS.targets, rows);
    return row;
  }
  const { data, error } = await sb.from("daily_targets").upsert(row, { onConflict: "user_id,date" }).select().single();
  if (error) {
    console.warn("Supabase upsert daily_targets failed, fallback to local.", error);
    const rows = lsGet(LS_KEYS.targets, []);
    const idx = rows.findIndex((r) => r.user_id === row.user_id && r.date === row.date);
    if (idx >= 0) rows[idx] = { ...rows[idx], ...row };
    else rows.push(row);
    lsSet(LS_KEYS.targets, rows);
    return row;
  }
  // 同步缓存
  const rows = lsGet(LS_KEYS.targets, []);
  const idx = rows.findIndex((r) => r.user_id === data.user_id && r.date === data.date);
  if (idx >= 0) rows[idx] = data;
  else rows.push(data);
  lsSet(LS_KEYS.targets, rows);
  return data;
}

async function dbListDailyTargets(userId) {
  const local = lsGet(LS_KEYS.targets, []).filter((t) => t.user_id === userId);
  if (!hasSupabaseConfig()) return local;

  const sb = getSupabaseClient();
  const { data, error } = await sb.from("daily_targets").select("*").eq("user_id", userId).order("date", { ascending: true });
  if (error) {
    console.warn("Supabase list daily_targets failed, fallback to local.", error);
    return local;
  }
  lsSet(LS_KEYS.targets, data || []);
  return data || [];
}

// 活动量选项
const ACTIVITY_LEVELS = {
  A: { label: "几乎不运动，久坐办公", desc: "每天坐办公室，很少走路，基本不锻炼", coeff: 1.2 },
  B: { label: "轻度活动", desc: "每周轻度运动1～3天，或周末偶尔打球、散步", coeff: 1.375 },
  C: { label: "经常运动", desc: "每周中度运动3～5次，每次30分钟以上", coeff: 1.55 },
  D: { label: "高度活动", desc: "每周高强度训练6～7天，或有规律的健身习惯", coeff: 1.75 },
  E: { label: "极高活动", desc: "体力劳动为主，或专业运动员级别", coeff: 1.9 },
};

function goalCoefficient(goal) {
  if (goal === "减脂") return 0.85;
  if (goal === "增肌") return 1.1;
  return 1.0; // 维持
}

function normalizeGender(gender) {
  // 产品约束：只保留“女 / 男”
  return gender === "男" ? "男" : "女";
}

function genderFloor(gender) {
  if (normalizeGender(gender) === "女") return 1200;
  return 1500; // 男
}

function isBaseline(profile, dateStr) {
  if (!profile?.baseline_start_date) return true;
  if (profile.is_baseline_complete) return false;
  const dayIndex = diffDays(profile.baseline_start_date, dateStr) + 1;
  return dayIndex >= 1 && dayIndex <= 7;
}

function baselineDayIndex(profile, dateStr) {
  if (!profile?.baseline_start_date) return 1;
  return diffDays(profile.baseline_start_date, dateStr) + 1;
}

function remainingBaselineDays(profile, dateStr) {
  const idx = baselineDayIndex(profile, dateStr);
  return clamp(7 - idx, 0, 7);
}

function sumItemsCalories(items) {
  return items.reduce((acc, it) => acc + Number(it.calories || 0), 0);
}

function sumItemsProtein(items) {
  return items.reduce((acc, it) => acc + Number(it.protein || 0), 0);
}

function calcMealTotal(items, eatenPercentage) {
  const raw = sumItemsCalories(items);
  const factor = clamp(Number(eatenPercentage) / 100, 0.1, 1);
  return raw * factor;
}

function calcMealProtein(items, eatenPercentage) {
  const raw = sumItemsProtein(items);
  const factor = clamp(Number(eatenPercentage) / 100, 0.1, 1);
  return round(raw * factor);
}

function calcDailyProteinTarget(profile) {
  if (!profile) return 0;
  const weight = Number(profile.weight || 0);
  const age = Number(profile.age || 0);
  const goal = profile.goal || "维持";
  if (!weight) return 0;

  let coef = 1.0;
  if (goal === "减脂") coef = 1.4;
  else if (goal === "增肌") coef = 1.8;
  else coef = 1.0; // 维持

  if (age >= 50) coef *= 1.1;
  const target = Math.min(weight * coef, weight * 2.0);
  return round(target);
}

function proteinProgressTone(actual, target) {
  if (!target || target <= 0) return "green";
  const ratio = actual / target;
  if (ratio >= 0.8) return "green";
  if (ratio >= 0.5) return "amber";
  return "rose";
}

function formatGram(g) {
  return Math.round(g);
}

function suggestionForMeal(items, overKcal) {
  // 生成“一句可执行的建议”
  const hasRice = items.find((it) => String(it.name).includes("米饭"));
  if (overKcal <= 0) {
    return {
      tone: "green",
      title: "✅ 吃完这顿还在目标内，放心享用！",
      detail: "如果吃得很满足，就已经很棒了。吃慢一点也会更舒服。",
    };
  }

  if (overKcal < 200) {
    if (hasRice) {
      const save = Math.max(80, round(Number(hasRice.calories) * 0.5));
      return {
        tone: "amber",
        title: `⚠️ 预计超标约 ${round(overKcal)} kcal。`,
        detail: `建议：米饭减半，可节省约 ${save} kcal。你不需要“忍”，只是做个小调整。`,
      };
    }
    return {
      tone: "amber",
      title: `⚠️ 预计超标约 ${round(overKcal)} kcal。`,
      detail: "建议：主食少一两口，或者把酱汁少拌一点点，就能轻松找回余量。",
    };
  }

  // >= 200
  const lines = [];
  if (hasRice) {
    const save = Math.max(80, round(Number(hasRice.calories) * 0.5));
    lines.push(`1) 米饭减半（大约省 ${save} kcal）`);
  } else {
    lines.push("1) 主食先吃到七分饱（给身体留一点余地）");
  }
  lines.push("2) 跳过含糖饮料（一般一杯可省约 150 kcal）");
  lines.push("3) 多夹蔬菜，优先清淡做法（吃得饱，也更稳）");
  return {
    tone: "rose",
    title: "🔸 这顿热量较高。",
    detail: lines.join("<br/>"),
  };
}

function toneToColors(tone) {
  if (tone === "amber") return { ring: "var(--amber)", chipBg: "rgba(217,164,65,0.14)", chipText: "rgb(146, 95, 16)" };
  if (tone === "rose") return { ring: "var(--rose)", chipBg: "rgba(201,122,134,0.14)", chipText: "rgb(134, 59, 73)" };
  return { ring: "var(--brand)", chipBg: "rgba(74,124,89,0.14)", chipText: "rgb(39, 84, 57)" };
}

function remainingTone(remaining) {
  if (remaining > 300) return "green";
  if (remaining >= 0) return "amber";
  return "rose";
}

function intakeProgressTone(actual, target) {
  if (!target || target <= 0) return "green";
  if (actual <= target * 0.6) return "green";
  if (actual <= target) return "amber";
  return "rose";
}

function calcBMR(profile) {
  // 标准 Mifflin-St Jeor 公式（男女分开）
  if (!profile) return 0;
  const weight = Number(profile.weight || 0);
  const height = Number(profile.height || 0);
  const age = Number(profile.age || 0);
  const gender = normalizeGender(profile.gender);
  if (!weight || !height || !age) return 0;
  const bmr = gender === "男" ? 10 * weight + 6.25 * height - 5 * age + 5 : 10 * weight + 6.25 * height - 5 * age - 161;
  return round(Math.max(bmr, 0));
}

function getActivityCoefficient(profile) {
  if (profile?.activity_coefficient != null) return Number(profile.activity_coefficient);
  // 没选过活动量：默认 1.2（久坐）
  return 1.2;
}

function estimateTDEE(profile) {
  // TDEE = BMR × 活动系数
  const bmr = calcBMR(profile);
  if (!bmr) return 0;
  const coeff = getActivityCoefficient(profile);
  return round(bmr * coeff);
}

function estimateMifflinTarget(profile) {
  // 保留兼容旧逻辑：基线期首页用 TDEE
  return estimateTDEE(profile);
}

async function ensureTodayRows(userId, profile, dateStr) {
  // 确保当天 daily_targets 存在（baseline/active 都需要累计 actual）
  const targets = await dbListDailyTargets(userId);
  const found = targets.find((t) => t.date === dateStr);
  if (found) return found;

  const row = {
    id: uid(),
    user_id: userId,
    date: dateStr,
    target_calories: null,
    actual_calories: 0,
    is_baseline_day: isBaseline(profile, dateStr),
  };
  return dbUpsertDailyTarget(row);
}

async function computeRollingAvg(userId, dateStr /* today */) {
  // “去掉今天”，取过去 7 天的 actual_calories
  const targets = await dbListDailyTargets(userId);
  const d = parseDateStr(dateStr);
  const end = new Date(d);
  end.setDate(end.getDate() - 1);
  const endStr = todayStr(end);
  const dates = getLastNDates(7, endStr);
  const vals = dates
    .map((ds) => targets.find((t) => t.date === ds)?.actual_calories)
    .filter((x) => typeof x === "number");
  if (vals.length === 0) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

async function maybeCompleteBaseline(userId, profile, dateStr) {
  if (!profile?.baseline_start_date) return profile;
  if (profile.is_baseline_complete) return profile;

  // 基线期按“连续 7 天”理解：start_date 起算，满 7 天后（第 8 天起）即可完成
  const dayIdx = baselineDayIndex(profile, dateStr);
  if (dayIdx <= 7) return profile;

  // 更保险：检查基线 7 天是否都有记录（有 daily_targets 行即可）
  const targets = await dbListDailyTargets(userId);
  const mustDates = [];
  const start = parseDateStr(profile.baseline_start_date);
  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    mustDates.push(todayStr(d));
  }
  const hasAll = mustDates.every((ds) => targets.some((t) => t.date === ds));
  if (!hasAll) return profile;

  const avg = await computeRollingAvg(userId, dateStr);
  const next = { ...profile, is_baseline_complete: true, adaptive_baseline: avg == null ? null : round(avg) };
  await dbUpsertProfile(next);
  return next;
}

async function ensureTodayTarget(userId, profile, dateStr) {
  // TODO: 真正的“每天凌晨 0 点”应由后端调度；这里做一个前端兜底（打开 App 或记录一餐时触发）。
  if (!profile?.is_baseline_complete) return null;
  const targets = await dbListDailyTargets(userId);
  const todayRow = targets.find((t) => t.date === dateStr);
  if (todayRow?.target_calories != null) return todayRow;

  const rolling = await computeRollingAvg(userId, dateStr);
  if (rolling == null) return null;
  const coef = goalCoefficient(profile.goal);
  const floor = genderFloor(profile.gender);
  const target = Math.max(floor, round(rolling * coef));

  const row = {
    id: todayRow?.id || uid(),
    user_id: userId,
    date: dateStr,
    target_calories: target,
    actual_calories: todayRow?.actual_calories ?? 0,
    is_baseline_day: false,
  };
  await dbUpsertDailyTarget(row);

  const nextProfile = { ...profile, adaptive_baseline: round(rolling) };
  await dbUpsertProfile(nextProfile);
  return row;
}

function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const query = {};
  if (qs) {
    qs.split("&").forEach((kv) => {
      const [k, v] = kv.split("=");
      query[decodeURIComponent(k)] = decodeURIComponent(v || "");
    });
  }
  return { path: path || "home", query };
}

function navigate(path) {
  location.hash = `#/${path}`;
}

function bindClicks() {
  $app.querySelectorAll("[data-click]").forEach((el) => {
    let fired = false;
    const handler = (e) => {
      if (fired) return;
      fired = true;
      setTimeout(() => { fired = false; }, 500);
      const name = el.getAttribute("data-click");
      if (!name) return;
      const fn = actions[name];
      if (typeof fn === "function") fn(e, el);
    };
    el.addEventListener("click", handler);
    el.addEventListener("touchend", handler);
  });
}

function HomePage() {
  const p = state.profile;
  if (!p) {
    return `
      <div class="safe-top px-4 pt-6">
        ${Card({
          inner: `
            <div class="font-semibold">先简单填一下资料</div>
            <div class="text-sm text-slate-600 mt-2 leading-relaxed">
              我们会用你的真实饮食习惯来计算基线，而不是套一条固定公式。
            </div>
            <div class="mt-4">${Button({ label: "去填写", onClick: "goOnboarding" })}</div>
          `,
        })}
      </div>
    `;
  }

  const dateStr = todayStr();
  const isB = isBaseline(p, dateStr);
  const dayIdx = baselineDayIndex(p, dateStr);
  const remainingDays = remainingBaselineDays(p, dateStr);

  const todayTarget = state.targets.find((t) => t.date === dateStr);
  const actual = todayTarget?.actual_calories ?? 0;
  const estimatedTarget = estimateMifflinTarget(p);
  const adaptiveTarget =
    todayTarget?.target_calories ??
    (p.adaptive_baseline != null ? Math.max(genderFloor(p.gender), round(Number(p.adaptive_baseline) * goalCoefficient(p.goal))) : 0);
  const displayTarget = isB ? estimatedTarget : adaptiveTarget;
  const remaining = displayTarget - actual;
  const tone = intakeProgressTone(actual, displayTarget);
  const colors = toneToColors(tone);
  const percent = displayTarget > 0 ? (actual / displayTarget) * 100 : 0;

  const subtitle = isB
    ? `📊 基线收集中（剩 ${remainingDays} 天），目标为估算值`
    : "📊 基于您的真实饮食习惯计算";

  const summaryCard = Card({
    className: "pt-5 pb-4",
    inner: `
      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="text-xs font-medium tracking-[0.02em] text-slate-500">今日目标热量</div>
          <div class="text-[30px] leading-none font-semibold tracking-tight text-slate-900 mt-2">${formatKcal(displayTarget)}<span class="text-base font-medium text-slate-500 ml-1">kcal</span></div>
        </div>
        <div class="pill px-3 py-1 text-xs font-medium shrink-0" style="background:${colors.chipBg}; color:${colors.chipText};">
          ${tone === "green" ? "安全区间" : tone === "amber" ? "接近上限" : "已超目标"}
        </div>
      </div>
      <div class="mt-4 rounded-2xl bg-slate-50/80 border border-slate-200/70 px-4 py-3">
        <div class="text-sm text-slate-700">已摄入：<span class="font-semibold text-slate-900">${formatKcal(actual)} kcal</span> | 还可吃：<span class="font-semibold text-slate-900">${formatKcal(remaining)} kcal</span></div>
      </div>
      <div class="mt-3 inline-flex items-center rounded-full bg-brand/5 px-3 py-1 text-xs text-slate-500">${subtitle}</div>
    `,
  });

  const snackHint =
    remaining > 0
      ? `
        <div class="mt-3 rounded-2xl bg-white/65 px-4 py-3 text-sm text-slate-600 text-center leading-relaxed border border-white/70">
          今天还能吃约 <span class="font-semibold text-slate-800">${formatKcal(remaining)} kcal</span> 的正餐/零食/饮料 🍵
        </div>
      `
      : "";

  // 蛋白质统计
  const proteinTarget = calcDailyProteinTarget(p);
  const actualProtein = Math.round(
    (() => {
      const mealsToday = state.meals.filter((m) => todayStr(new Date(m.created_at)) === dateStr);
      return mealsToday.reduce((acc, m) => acc + (Number(m.meal_total_protein) || 0), 0);
    })()
  );
  const pTone = proteinProgressTone(actualProtein, proteinTarget);
  const pColors = toneToColors(pTone);
  const proteinPct = proteinTarget > 0 ? Math.min((actualProtein / proteinTarget) * 100, 100) : 0;
  const proteinRemaining = Math.max(0, proteinTarget - actualProtein);

  const proteinHintText = (() => {
    if (proteinPct >= 80) return "蛋白质摄入充足，继续保持 💪";
    if (proteinPct >= 50) return `今天还可以补充约 ${formatGram(proteinRemaining)}g 蛋白质，建议晚餐加一个鸡蛋或一杯牛奶`;
    return "今天蛋白质摄入偏少，长期不足可能影响代谢，建议多吃鱼、肉、蛋、豆";
  })();

  const proteinCard = `
    <div class="mt-3 card p-4">
      <div class="flex items-center justify-between">
        <div class="text-sm font-medium">🧬 蛋白质：已摄入 ${formatGram(actualProtein)}g / 目标 ${proteinTarget}g</div>
        <div class="pill px-2 py-0.5 text-xs" style="background:${pColors.chipBg}; color:${pColors.chipText};">
          ${pTone === "green" ? "充足" : pTone === "amber" ? "需补充" : "偏少"}
        </div>
      </div>
      <div class="mt-3 h-2 w-full rounded-full bg-slate-200/60 overflow-hidden">
        <div class="h-full rounded-full transition-all duration-500" style="width:${proteinPct}%;background:${pColors.ring}"></div>
      </div>
      ${!isB ? `<div class="text-xs text-slate-500 mt-2 leading-relaxed">${proteinHintText}</div>` : ""}
    </div>
  `;

  if (isB) {
    const ring = Ring({
      percent,
      labelTop: "今日已摄入",
      labelMain: `${formatKcal(actual)} kcal`,
      ringColor: colors.ring,
    });

    const info = Card({
      className: "mt-5",
      inner: `
        <div class="flex items-center justify-between">
          <div class="text-sm font-medium">观察期说明</div>
          <div class="pill px-3 py-1 text-xs" style="background: rgba(74,124,89,0.10); color: rgb(39,84,57);">只记录，不评判</div>
        </div>
        <div class="mt-3 inline-flex items-center rounded-full border border-brand/10 bg-brand/5 px-3 py-1 text-xs font-medium text-brand">
          第 ${dayIdx} 天 · 观察期
        </div>
        <div class="text-sm text-slate-600 mt-3 leading-relaxed">
          这一周我们不会给任何警告或建议。你只要像平时一样吃（包括水果，点心，饮料等），就能得到更真实、更适合你的基线。
        </div>
      `,
    });

    return PageShell({
      title: "首页",
      activeTab: "home",
      fab: true,
      body: `
        ${summaryCard}
        ${snackHint}
        ${proteinCard}
        <div class="flex justify-center pt-2">${ring}</div>
        ${info}
      `,
    });
  }

  // Active
  const ring = Ring({
    percent,
    labelTop: "今日已摄入",
    labelMain: `${formatKcal(actual)} kcal`,
    ringColor: colors.ring,
  });

  const baselineHint = p.adaptive_baseline
    ? `<div class="text-xs text-slate-500 mt-2">当前自适应基线（过去 7 天均值）：${formatKcal(p.adaptive_baseline)} kcal</div>`
    : "";

  const status = Card({
    className: "mt-5",
    inner: `
      <div class="flex items-center justify-between">
        <div class="text-sm font-medium">今天的节奏</div>
        <div class="pill px-3 py-1 text-xs" style="background:${colors.chipBg}; color:${colors.chipText};">
          ${tone === "green" ? "余量充足" : tone === "amber" ? "接近目标" : "已超出"}
        </div>
      </div>
      <div class="text-sm text-slate-600 mt-3 leading-relaxed">
        目标不是“完美控制”，而是让你更容易停在舒服的位置。你随时都可以记录一顿，我们再一起看看。
      </div>
      ${baselineHint}
    `,
  });

  return PageShell({
    title: "首页",
    activeTab: "home",
    fab: true,
    body: `
      ${summaryCard}
      ${snackHint}
      ${proteinCard}
      <div class="flex justify-center pt-2">${ring}</div>
      ${status}
    `,
  });
}

function ReviewPage() {
  const p = state.profile;
  const dateStr = todayStr();
  const isB = isBaseline(p, dateStr);
  const d = state.draft || { items: [], eatenPercentage: 100 };

  const mealTotal = round(calcMealTotal(d.items || [], d.eatenPercentage || 100));
  const mealProtein = round(calcMealProtein(d.items || [], d.eatenPercentage || 100));
  const todayRow = state.targets.find((t) => t.date === dateStr) || { actual_calories: 0, target_calories: null };
  const actual = todayRow.actual_calories ?? 0;
  const target = todayRow.target_calories ?? null;

  const predicted = actual + mealTotal;
  const over = target == null ? null : predicted - target;

  const toneCard = isB
    ? ToneCard({
        tone: "green",
        title: "观察期：只记录就好",
        detail: "这一周没有“超标”这回事。你记录得越真实，后面的目标就越贴近你的生活。",
      })
    : (() => {
        const s = suggestionForMeal(d.items || [], over || 0);
        return ToneCard({ tone: s.tone, title: s.title, detail: s.detail });
      })();

  const items = (d.items || [])
    .map((it) => `<div class="flex items-center justify-between py-1"><div class="text-sm">${escapeHtml(it.name)}</div><div class="text-sm text-slate-600">${formatKcal(it.calories)} kcal</div></div>`)
    .join("");

  const summary = Card({
    inner: `
      <div class="flex items-center justify-between">
        <div>
          <div class="text-sm text-slate-500">本餐预计</div>
          <div class="text-2xl font-semibold mt-1">${formatKcal(mealTotal)} kcal</div>
        </div>
        <div class="text-right">
          <div class="text-xs text-slate-500">比例</div>
          <div class="pill inline-flex px-3 py-1 text-sm font-semibold mt-1">${d.eatenPercentage}%</div>
        </div>
      </div>
      <div class="text-xs text-slate-500 mt-2">本餐蛋白质合计：<span class="font-semibold">${formatGram(mealProtein)}g</span></div>
      ${Divider()}
      <div class="text-sm font-medium mb-2">明细</div>
      <div class="divide-y divide-slate-200/70">${items}</div>
    `,
  });

  const compare =
    target == null
      ? ""
      : Card({
          className: "mt-4",
          inner: `
            <div class="flex items-center justify-between">
              <div class="text-sm text-slate-500">餐前预估（今天）</div>
              <div class="text-sm text-slate-600">目标：${formatKcal(target)} kcal</div>
            </div>
            <div class="mt-2 text-sm text-slate-700">
              已吃：${formatKcal(actual)} kcal  →  预计吃完：<span class="font-semibold">${formatKcal(predicted)} kcal</span>
            </div>
          `,
        });

  return PageShell({
    title: "确认保存",
    activeTab: "home",
    fab: false,
    rightHtml: SmallButton({ label: "返回", onClick: "goRecognize" }),
    body: `
      ${summary}
      <div class="mt-4">${toneCard}</div>
      ${compare}
      <div class="mt-4">
        ${Button({ label: "保存这顿（不会阻止）", onClick: "saveMeal" })}

    .filter((m) => todayStr(new Date(m.created_at)) === dateStr)

    ? meals
        .map((m) => {

async function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result || "");
      // 手机/iPad 拍照 data URL 可能超过 localStorage 5MB 限制，强制压缩
      if (dataUrl.length > 200 * 1024) {
        compressImage(file, (compressed) => resolve(compressed), 1200);
      } else {
        resolve(dataUrl);
      }
    };
    reader.onerror = () => {
      console.error("[EatGuard] FileReader 读取失败");
      reject(new Error("FileReader error"));
    };
    reader.readAsDataURL(file);
  });
}

function compressImage(file, callback, maxWidth) {
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    URL.revokeObjectURL(url);
    const canvas = document.createElement("canvas");
    let w = img.width, h = img.height;
    if (w > maxWidth) { h = (h * maxWidth) / w; w = maxWidth; }
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, w, h);
    // 用 JPEG 质量 0.6 大幅减小体积
    callback(canvas.toDataURL("image/jpeg", 0.6));
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    console.error("[EatGuard] 图片加载失败，返回原始文件");
    // 降级：重新用 FileReader 读取（不加压缩）
    const reader = new FileReader();
    reader.onload = () => callback(String(reader.result || ""));
    reader.onerror = () => callback("");
    reader.readAsDataURL(file);
  };
  img.src = url;
}

/* 从 data URL 压缩图片（用于 saveMeal 前的大图压缩） */
function compressImageFromDataUrl(dataUrl, maxWidth) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = (h * maxWidth) / w; w = maxWidth; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", 0.5));
    };
    img.onerror = () => reject(new Error("图片加载失败"));
    img.src = dataUrl;
  });
}

        c.classList.remove("selected");
        c.style.borderColor = "";
        c.style.backgroundColor = "";
        const d = c.querySelector(".radio-dot");
        if (d) d.style.borderColor = "";
        const inner = c.querySelector(".radio-dot-inner");
        if (inner) { inner.style.opacity = "0"; inner.style.backgroundColor = ""; }
      });
      card.classList.add("selected");
      card.style.borderColor = "var(--brand)";
      card.style.backgroundColor = "#F0FDF4";
      const dot = card.querySelector(".radio-dot");
      if (dot) dot.style.borderColor = "var(--brand)";
      const inner = card.querySelector(".radio-dot-inner");
      if (inner) {
        inner.style.opacity = "1";
        inner.style.backgroundColor = "var(--brand)";
      }
      if (btn) {
        btn.disabled = false;
        btn.classList.remove("opacity-50", "pointer-events-none");
      }
    });
  });
}

function bindRadioGroups() {
  const opts = $app.querySelectorAll(".radio-opt");
  opts.forEach((opt) => {
    opt.addEventListener("click", () => {
      const group = opt.dataset.group;
      const val = opt.dataset.val;
      const input = $app.querySelector(`#${group}`);
      if (input) input.value = val;
      const siblings = $app.querySelectorAll(`.radio-opt[data-group="${group}"]`);
      siblings.forEach((s) => {
        s.classList.remove("radio-opt-selected");
        s.style.borderColor = "";
        s.style.backgroundColor = "";
        const d = s.querySelector(".radio-dot");
        if (d) d.style.borderColor = "";
        const inner = s.querySelector(".radio-dot-inner");
        if (inner) { inner.style.opacity = "0"; inner.style.backgroundColor = ""; }
      });
      opt.classList.add("radio-opt-selected");
      opt.style.borderColor = "var(--brand)";
      opt.style.backgroundColor = "#F0FDF4";
      const dot = opt.querySelector(".radio-dot");
      if (dot) dot.style.borderColor = "var(--brand)";
      const inner = opt.querySelector(".radio-dot-inner");
      if (inner) {
        inner.style.opacity = "1";
        inner.style.backgroundColor = "var(--brand)";
      }
    });
  });
}

function bindCaptureButtons() {
  const btn = $app.querySelector("#btnOpenActionSheet");
  if (!btn) return;
  btn.addEventListener("click", showActionSheet);
  btn.addEventListener("touchend", (e) => { e.preventDefault(); showActionSheet(); });
}

function showActionSheet() {
  // 移除旧面板
  const old = $app.querySelector(".action-sheet-overlay");
  if (old) old.remove();

  const overlay = document.createElement("div");
  overlay.className = "action-sheet-overlay";
  overlay.innerHTML = `
    <div class="action-sheet-panel">
      <div class="action-sheet-item" id="asCamera">📷 拍照</div>
      <div class="action-sheet-item" id="asGallery">🖼️ 从相册选择</div>
      <div class="action-sheet-item action-sheet-cancel" id="asCancel">取消</div>
    </div>
  `;
  document.body.appendChild(overlay);

  // 点击遮罩关闭
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) overlay.remove();
  });

  const pickFile = (input) => {
    const file = input?.files?.[0];
    overlay.remove(); // 立即关闭弹窗
    if (!file) return;
    console.log("[EatGuard] 图片已选择:", file.name, file.size, "bytes");
    fileToDataUrl(file).then((url) => {
      state.draft = { photoUrl: url, items: pickSimulatedItems(), eatenPercentage: 100 };
      render();
      setTimeout(() => setToast("照片已选择"), 200);
    }).catch((err) => {
      console.error("[EatGuard] 图片处理失败:", err);
      setToast("图片处理失败，请重试。");
    });
  };

  // 拍照 → 直接调用相机
  const asCam = overlay.querySelector("#asCamera");
  if (asCam) {
    const openCam = () => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";
      input.setAttribute("capture", "environment");
      input.addEventListener("change", () => pickFile(input));
      input.click();
    };
    asCam.addEventListener("click", openCam);
    asCam.addEventListener("touchend", (e) => { e.preventDefault(); openCam(); });
  }

  // 从相册选择 → 不带 capture，iOS 会弹出系统相册
  const asGal = overlay.querySelector("#asGallery");
  if (asGal) {
    const openGal = () => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";
      input.addEventListener("change", () => pickFile(input));
      input.click();
    };
    asGal.addEventListener("click", openGal);
    asGal.addEventListener("touchend", (e) => { e.preventDefault(); openGal(); });
  }

  // 取消
  const asCancel = overlay.querySelector("#asCancel");
  if (asCancel) {
    const doCancel = () => overlay.remove();
    asCancel.addEventListener("click", doCancel);
    asCancel.addEventListener("touchend", (e) => { e.preventDefault(); doCancel(); });
  }
}

async function reloadData() {
  state.profile = await dbGetProfile(state.userId);
  state.meals = await dbListMeals(state.userId);
  state.targets = await dbListDailyTargets(state.userId);

  // 兜底：若已有 profile，则确保今日 row & 今日目标
  if (state.profile) {
    // 兼容历史数据：把“其他”等值收敛为“女/男”
    const ng = normalizeGender(state.profile.gender);
    if (ng !== state.profile.gender) {
      state.profile = await dbUpsertProfile({ ...state.profile, gender: ng });
    }

    const dateStr = todayStr();
    await ensureTodayRows(state.userId, state.profile, dateStr);
    state.profile = await maybeCompleteBaseline(state.userId, state.profile, dateStr);
    await ensureTodayTarget(state.userId, state.profile, dateStr);
    state.targets = await dbListDailyTargets(state.userId);
  }
}

function render() {
  const { path, query } = parseRoute();

  // 首次无 profile：强制去 onboarding（除非就在 onboarding 或 activity）
  if (!state.profile && path !== "onboarding" && path !== "activity") {
    $app.innerHTML = OnboardingPage();
    bindClicks();
    return;
  }

  if (path === "onboarding") {
    $app.innerHTML = OnboardingPage();
    bindClicks();
    return;
  }

  if (path === "activity") {
    $app.innerHTML = ActivityStepPage();
    bindClicks();
    bindActivityCards();
    return;
  }

  if (path === "home") {
    $app.innerHTML = HomePage();
    bindClicks();
    return;
  }

  if (path === "capture") {
    $app.innerHTML = CapturePage();
    bindClicks();
    bindCaptureButtons();
    return;
  }

  if (path === "recognize") {
    $app.innerHTML = RecognizePage();
    bindClicks();
    bindRecognizeSlider();
    return;
  }

  if (path === "review") {
    $app.innerHTML = ReviewPage();
    bindClicks();
    return;
  }

  if (path === "history") {
    $app.innerHTML = HistoryPage();
    bindClicks();
    return;
  }

  if (path === "day") {
    const ds = query.date || todayStr();
    $app.innerHTML = DayDetailPage(ds);
    bindClicks();
    return;
  }

  if (path === "settings") {
    $app.innerHTML = SettingsPage();
    bindClicks();
    return;
  }

  if (path === "editprofile") {
    $app.innerHTML = EditProfilePage();
    bindClicks();
    bindRadioGroups();
    return;
  }

  // fallback
  navigate("home");
}

const renderDebounced = debounce(render, 10);
window.addEventListener("hashchange", renderDebounced);

// -----------------------------
// PWA：注册 Service Worker
// -----------------------------
async function registerSW() {
  if (!("serviceWorker" in navigator)) return;
  try {
    await navigator.serviceWorker.register("./sw.js", { scope: "./" });
  } catch (e) {
    console.warn("SW register failed", e);
  }
}

// -----------------------------
// 启动
// -----------------------------
(async function boot() {
  await reloadData();
  await registerSW();
  if (!location.hash) navigate("home");
  render();
})();

</script>
